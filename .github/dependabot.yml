version: 2

updates:
    - package-ecosystem: npm
      directory: /prompter-box/front
      target-branch: main
      schedule:
          interval: weekly
          day: monday
          time: '06:00'
          timezone: 'Europe/Amsterdam'
      # prompter-box/static/ is a committed build that check:dist reds on any bump changing output; one PR per run means one rebuild.
      groups:
          npm-version-updates:
              applies-to: version-updates
              patterns:
                  - '*'
          npm-security-updates:
              applies-to: security-updates
              patterns:
                  - '*'
      # vue-tsc 3.3 can't load TypeScript 7; lift this once vue-tsc supports it.
      ignore:
          - dependency-name: typescript
            versions: ['>=7']
          # CI runs Node 24; lift this once the Sentinel's node-version moves past it.
          - dependency-name: '@types/node'
            versions: ['>=25']
      open-pull-requests-limit: 10
      labels:
          - dependencies

    - package-ecosystem: github-actions
      directory: /
      target-branch: main
      schedule:
          interval: weekly
          day: monday
          time: '06:00'
          timezone: 'Europe/Amsterdam'
      open-pull-requests-limit: 5
      labels:
          - dependencies
